[package]
name = "tenant-account-eraser"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Revoke a SaaS user's sessions and credential before local account deletion"

[dependencies]
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

